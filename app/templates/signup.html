{% extends "base.html" %}

{% block title %}크루 신청 - JD-MATCH{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-6 col-lg-5">
        <div class="text-center mb-5">
            <h1 class="fw-bold text-gradient mb-2" style="font-size: 2.5rem; letter-spacing: -1.5px;">크루 신청</h1>
            <p class="small" style="color: var(--text-muted);">시스템 프로필을 초기화하고 매칭 대기열에 합류하세요.</p>
        </div>

        <div class="dashboard-card" style="padding: 2.5rem !important;">
            <form id="signupForm" action="/register" method="post">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="nickname" class="metallic-label">식별 닉네임</label>
                        <input type="text" class="metallic-input" id="nickname" name="nickname" placeholder="Nickname" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="password" class="metallic-label">보안 비밀번호</label>
                        <input type="password" class="metallic-input" id="password" name="password" placeholder="Passcode" required>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="desired_job" class="metallic-label">직무 역할 선택</label>
                    <select class="metallic-input" id="desired_job" name="desired_job" required style="cursor: pointer; appearance: none;">
                        <option value="" selected disabled>직무 선택</option>
                        <option value="Backend">백엔드 엔지니어</option>
                        <option value="Frontend">프론트엔드 엔지니어</option>
                        <option value="Data">데이터 사이언티스트</option>
                        <option value="DevOps">데브옵스 엔지니어</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="target_company" class="metallic-label">목표 도메인/기업 (선택)</label>
                    <input type="text" class="metallic-input" id="target_company" name="target_company" placeholder="예: 네이버, 토스, 카카오">
                </div>

                <div class="mb-5">
                    <label for="interest_keywords" class="metallic-label">관심 기술 스택 (쉼표 구분)</label>
                    <input type="text" class="metallic-input" id="interest_keywords" name="interest_keywords" placeholder="예: Spring Boot, Redis, Kafka">
                </div>

                <button type="submit" class="btn-primary-neon w-100 py-3" style="font-size: 0.9rem;">신청 프로토콜 실행</button>
            </form>
            
            <div class="mt-4 pt-3 border-top text-center" style="border-color: rgba(255,255,255,0.1) !important;">
                <p class="small" style="font-size: 0.75rem; color: var(--text-muted);">이미 가입하셨나요? <a href="/login-page" class="fw-bold" style="color: var(--accent-text);">로그인</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const jsonData = {};
        formData.forEach((value, key) => { jsonData[key] = value; });
        try {
            const response = await fetch('/register', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(jsonData),
            });
            if (response.ok) {
                alert('시스템 메시지: 등록 성공. 로그인을 진행해 주세요.');
                window.location.href = '/login-page';
            } else {
                const error = await response.json();
                alert('시스템 오류: ' + error.detail);
            }
        } catch (err) {
            console.error(err);
            alert('치명적 오류: 네트워크 연결 실패.');
        }
    });
</script>
{% endblock %}
