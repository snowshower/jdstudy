{% extends "base.html" %}

{% block title %}로그인 - JD-MATCH{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-5 col-lg-4">
        <div class="text-center mb-5">
            <h1 class="fw-bold text-gradient mb-2" style="font-size: 2.5rem; letter-spacing: -1.5px;">로그인</h1>
            <p class="small" style="color: var(--text-muted);">매칭 스트림을 확인하려면 인증이 필요합니다.</p>
        </div>

        <div class="dashboard-card" style="padding: 2rem !important;">
            <ul class="nav nav-pills mb-4 p-1" id="loginTab" role="tablist" style="background: rgba(255,255,255,0.05); border-radius: 0;">
                <li class="nav-item flex-fill" role="presentation">
                    <button class="nav-link w-100 active border-0 py-2" id="crew-tab" data-bs-toggle="pill" data-bs-target="#crew-login" type="button" role="tab" style="font-size: 0.75rem; border-radius: 0;">크루 로그인</button>
                </li>
                <li class="nav-item flex-fill" role="presentation">
                    <button class="nav-link w-100 border-0 py-2" id="admin-tab" data-bs-toggle="pill" data-bs-target="#admin-login" type="button" role="tab" style="font-size: 0.75rem; border-radius: 0;">관리자</button>
                </li>
            </ul>

            <div class="tab-content" id="loginTabContent">
                <!-- Crew Login -->
                <div class="tab-pane fade show active" id="crew-login" role="tabpanel">
                    <form id="crewLoginForm">
                        <div class="mb-3">
                            <label class="metallic-label">닉네임 아이디</label>
                            <input type="text" class="metallic-input" name="nickname" placeholder="닉네임 입력" required>
                        </div>
                        <div class="mb-4">
                            <label class="metallic-label">비밀번호</label>
                            <input type="password" class="metallic-input" name="password" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn-primary-neon w-100 py-3" style="font-size: 0.9rem;">시스템 접속</button>
                    </form>
                </div>

                <!-- Admin Login -->
                <div class="tab-pane fade" id="admin-login" role="tabpanel">
                    <form id="adminLoginForm">
                        <div class="mb-3">
                            <label class="metallic-label">관리자 ID</label>
                            <input type="text" class="metallic-input" name="nickname" placeholder="Admin_ID" required>
                        </div>
                        <div class="mb-4">
                            <label class="metallic-label">비밀번호</label>
                            <input type="password" class="metallic-input" name="password" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn-primary-neon w-100 py-3" style="font-size: 0.9rem;">루트 권한 인증</button>
                    </form>
                </div>
            </div>

            <div class="mt-4 text-center">
                <p class="small" style="font-size: 0.75rem; color: var(--text-muted);">미리 등록된 닉네임과 초기 비밀번호(1234)로 접속하세요.</p>
            </div>
        </div>
    </div>
</div>

<style>
    .nav-pills .nav-link {
        color: rgba(255, 255, 255, 0.5);
        font-weight: 400;
    }
    .nav-pills .nav-link.active {
        background: var(--accent-glow) !important;
        color: white !important;
    }
</style>
{% endblock %}

{% block scripts %}
<script>
    async function handleLogin(formId, url, redirectUrl) {
        const form = document.getElementById(formId);
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const jsonData = {};
            formData.forEach((value, key) => { jsonData[key] = value; });
            const response = await fetch(url, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(jsonData),
            });
            if (response.ok) { window.location.href = redirectUrl; }
            else { 
                const errorData = await response.json();
                alert('오류: ' + (errorData.detail || '접근이 거부되었습니다.')); 
            }
        });
    }
    handleLogin('crewLoginForm', '/login', '/results-page');
    handleLogin('adminLoginForm', '/admin/login', '/admin-page');
</script>
{% endblock %}
